# Claude Bridge Server Configuration
# ===================================

# Server Settings
server:
  # FIXED - ClaudeBridge 2.0 is slirp-only and the server refuses to start on
  # any other address. The guest reaches the host at 10.0.2.2, which arrives on
  # loopback, so the macOS firewall can stay on and the port is never exposed
  # to the LAN. Bridge mode would need 0.0.0.0 AND the firewall switched off -
  # that trade is what this version exists to avoid. For a guest that has to be
  # reachable on the LAN, use AppleBridge. See docs/NETWORK_MODES.md.
  host: "127.0.0.1"
  port: 8080

# Claude API Settings
claude:
  model: "claude-opus-4-5-20251101"
  max_tokens: 4096
  timeout: 120  # seconds for API call

# Job Management
jobs:
  timeout: 180  # seconds (3 minutes)
  max_history: 10  # max jobs to keep in memory
  refresh_interval: 3  # seconds for META REFRESH

# File Management
files:
  # Folder shared with the emulator (Basilisk II 'extfs'). Leave null to
  # disable the Shared Folder feature. ~ is expanded.
  shared_folder: "~/Desktop/Share"

# History
history:
  max_entries: 20  # max conversation history entries

# Web Proxy
proxy:
  # Block /proxy and /proxyimg from reaching the local machine or private
  # networks (127.0.0.1, 10/8, 192.168/16, 169.254/16, ...). Without this the
  # proxy is an open relay for anyone on the LAN. Only turn off if you
  # deliberately want to proxy something inside your own network.
  block_private_networks: true

# Setup Page (/setup)
setup:
  enabled: true          # false disables /setup entirely
  # Only serve /setup to clients on the loopback interface. In slirp mode the
  # guest reaches the host through loopback, so the page works; in bridge mode
  # the guest is a real LAN host and is refused. Turning this off exposes
  # server configuration to everyone who can reach the port.
  require_loopback: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "claude_bridge.log"  # log file path (null = no file logging)
  console: true  # log to console
