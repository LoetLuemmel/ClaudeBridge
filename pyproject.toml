[project]
name = "claudebridge"
version = "2.0.0"
description = "Claude for Netscape Navigator 3 on Classic Mac OS"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Pit Förster" }]
keywords = ["retrocomputing", "classic-mac", "system-7", "netscape", "basilisk-ii", "claude"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Emulators",
]

dependencies = [
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/LoetLuemmel/ClaudeBridge"
Issues = "https://github.com/LoetLuemmel/ClaudeBridge/issues"

[project.scripts]
claudebridge = "claude_bridge:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["applebridge", "applebridge.claude", "applebridge.proxy"]
py-modules = ["claude_bridge", "netmode"]
